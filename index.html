<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Dungeon Quest 3D</title>
<meta name="description" content="Dungeon Quest 3D — a hand-crafted first-person action-RPG in a single HTML file. Three classes, a town hub, designed dungeon floors, a boss, procedural audio. Plays on any device.">
<style>
:root{
  --fg:#e7ecf3; --muted:#98a0ad; --dim:#5d6573;
  --bg:#0a0c10; --panel:#13171f; --panel2:#1b2029; --line:#2c333f;
  --gold:#e8c24a; --gold2:#caa54a; --red:#d9433f; --blue:#3f7fd9; --green:#56b85b;
  --hp:#cf3b38; --mp:#2f6fd0; --sta:#3fae6a; --xp:#caa54a;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:"Courier New",Courier,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#000;color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;}
#game{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#10141c,#05070a 80%);display:flex;align-items:center;justify-content:center;}
#stage{position:relative;width:100%;height:100%;max-width:1280px;max-height:800px;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto;background:#05070a;}

/* ── retro/arcade text ── */
.arcade{font-family:var(--mono);text-transform:uppercase;letter-spacing:2px;font-weight:700;}
.glow{text-shadow:0 0 8px rgba(232,194,74,.6),0 2px 0 #000;}

/* ── generic buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(#222936,#161b24);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ui);transition:filter .08s,transform .04s;}
.btn:hover{filter:brightness(1.18);}
.btn:active{transform:translateY(1px);filter:brightness(.9);}
.btn.small{padding:7px 11px;font-size:12px;border-radius:8px;min-height:34px;}
.btn.primary{background:linear-gradient(#e8c24a,#b8902f);color:#1a1206;border-color:#e8c24a;text-shadow:none;}
.btn.danger{background:linear-gradient(#b5403c,#7e2724);border-color:#c0504c;color:#fff;}
.btn:disabled{opacity:.4;cursor:default;filter:none;}
.btn.primary{box-shadow:0 4px 16px rgba(232,194,74,.32),inset 0 1px 0 rgba(255,255,255,.25);}
/* graphical menu buttons: gold accent bar, depth, hover lift */
.menu-btns .btn{padding:13px 18px 13px 20px;font-size:15px;border-radius:12px;letter-spacing:.3px;justify-content:flex-start;box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);}
.menu-btns .btn:not(.primary):not(.danger){border-left:3px solid var(--gold);background:linear-gradient(100deg,#262d3b,#171c25 70%);}
.menu-btns .btn:hover{transform:translateY(-2px);filter:brightness(1.14);}
.menu-btns .btn:active{transform:translateY(0);}
.panel h2{position:relative;padding-bottom:8px;}
.panel h2::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:64px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}

/* ── overlay panels (menus/dialogue/shop) ── */
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;padding:18px;text-align:center;}
.overlay.show{display:flex;animation:fade .25s ease;}
.scrim{position:absolute;inset:0;background:rgba(5,7,11,.82);backdrop-filter:blur(2px);}
.panel{position:relative;z-index:1;background:linear-gradient(#161b24,#0f131a);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);padding:22px;max-width:560px;width:100%;max-height:90%;overflow-y:auto;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

/* ── title screen ── */
#menu{position:relative;padding-top:6px;}
#menu .crest{font-size:44px;line-height:1;margin-bottom:2px;filter:drop-shadow(0 2px 8px rgba(232,194,74,.55));}
#menu .title{font-size:clamp(32px,7.5vw,60px);color:var(--gold);margin:0;line-height:1;letter-spacing:3px;text-shadow:0 0 18px rgba(232,194,74,.55),0 3px 0 #000;animation:tglow 2.8s ease-in-out infinite;}
@keyframes tglow{0%,100%{text-shadow:0 0 14px rgba(232,194,74,.4),0 3px 0 #000;}50%{text-shadow:0 0 30px rgba(232,194,74,.85),0 3px 0 #000;}}
#menu .tag{color:#efe1b4;font-size:12.5px;margin:12px auto 20px;letter-spacing:1px;background:rgba(232,194,74,.1);border:1px solid rgba(232,194,74,.28);padding:5px 14px;border-radius:20px;width:fit-content;}
#menu::before{content:'';position:absolute;left:50%;top:18px;width:300px;height:170px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(232,194,74,.16),transparent 70%);pointer-events:none;}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(340px,80vw);margin:0 auto;}
.creditline{color:var(--dim);font-size:11px;margin-top:18px;line-height:1.6;}

/* ── class select ── */
.classrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0 6px;}
.classcard{flex:1;min-width:150px;max-width:180px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .12s,transform .08s,filter .12s;}
.classcard:hover{filter:brightness(1.12);}
.classcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,194,74,.25);transform:translateY(-3px);}
.classcard .ico{font-size:34px;margin-bottom:6px;}
.classcard h3{margin:0 0 4px;font-size:15px;}
.classcard p{margin:0;font-size:11px;color:var(--muted);line-height:1.5;}

/* ── in-game HUD ── */
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;font-family:var(--ui);}
#hud .topleft{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:5px;width:min(260px,46vw);}
.bar{height:13px;border-radius:7px;background:rgba(8,10,14,.7);border:1px solid rgba(0,0,0,.5);overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.bar>i{display:block;height:100%;width:0;transition:width .12s linear;}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-size:9px;font-weight:800;font-family:var(--mono);letter-spacing:.5px;text-shadow:0 1px 1px #000;}
.bar.hp>i{background:linear-gradient(#e2514d,#a52a27);}
.bar.mp>i{background:linear-gradient(#4f8de0,#264f9c);}
.bar.sta>i{background:linear-gradient(#54c07a,#2c7a4a);}
.bar.xp{height:7px;} .bar.xp>i{background:linear-gradient(#e8c24a,#9c7a1e);}
#hud .meta{position:absolute;left:14px;top:0;transform:translateY(-2px);}
#hud .topright{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
#minimap{position:relative;width:120px;height:120px;border:1px solid var(--line);border-radius:8px;background:rgba(8,10,14,.66);box-shadow:0 4px 16px rgba(0,0,0,.4);}
#objective{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,10,14,.6);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--gold);max-width:70vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#log{position:absolute;left:12px;bottom:96px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:11px;color:#cfd6df;text-shadow:0 1px 2px #000;max-width:60vw;}
#log div{opacity:.92;}
#interact{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);background:rgba(232,194,74,.92);color:#1a1206;font-weight:800;font-size:12px;padding:6px 14px;border-radius:20px;display:none;font-family:var(--mono);letter-spacing:.5px;}
#interact.show{display:block;animation:pop .15s;}

/* ── on-screen controls (touch) ── */
#touch{position:absolute;inset:0;z-index:25;pointer-events:none;}
#stick{position:absolute;left:18px;bottom:18px;width:128px;height:128px;border-radius:50%;background:rgba(20,24,32,.42);border:1px solid var(--line);pointer-events:auto;touch-action:none;}
#stick .nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(120,132,150,.6);border:1px solid rgba(255,255,255,.2);}
.actbtns{position:absolute;right:14px;bottom:18px;display:grid;grid-template-columns:64px 64px;grid-auto-rows:64px;gap:10px;pointer-events:none;}
.actbtns .ab{pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(28,33,43,.7);border:1px solid var(--line);font-size:22px;font-weight:800;font-family:var(--mono);color:var(--fg);}
.actbtns .ab.big{width:64px;height:64px;} .actbtns .ab:active{filter:brightness(1.4);}
.actbtns .ab.atk{background:rgba(150,52,48,.7);} .actbtns .ab.cast{background:rgba(52,86,150,.7);} .actbtns .ab.abil{background:rgba(60,120,80,.7);}
.toprow{position:absolute;right:10px;bottom:160px;display:flex;gap:8px;pointer-events:auto;}
.toprow .ab{width:46px;height:46px;font-size:16px;}

/* hide touch controls on devices with a fine pointer (desktop) unless forced */
@media (pointer:fine){ #touch.autohide{display:none;} }
/* iPads/touchscreens (which may also report a fine pointer via trackpad) keep their controls */
html.touch #touch.autohide{display:block;}
.toprow{flex-wrap:wrap;justify-content:flex-end;max-width:64vw;}
/* bigger, comfier controls on tablet-sized touch screens (iPad) */
@media (min-width:760px){
  html.touch #stick{width:156px;height:156px;left:26px;bottom:26px;}
  html.touch #stick .nub{width:64px;height:64px;margin:-32px;}
  html.touch .actbtns{grid-template-columns:80px 80px;grid-auto-rows:80px;gap:12px;right:24px;bottom:26px;}
  html.touch .actbtns .ab.big{width:80px;height:80px;} html.touch .actbtns .ab{font-size:27px;}
  html.touch .toprow{bottom:190px;right:18px;}
  html.touch .toprow .ab{width:56px;height:56px;font-size:20px;}
}

/* ── dialogue ── */
#dialogue{position:absolute;left:0;right:0;bottom:0;z-index:45;display:none;padding:14px;}
#dialogue.show{display:block;animation:fade .2s;}
.dbox{max-width:640px;margin:0 auto;background:linear-gradient(#171c25,#0e121a);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 -8px 30px rgba(0,0,0,.5);}
.dbox .who{color:var(--gold);font-weight:800;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.dbox .por{width:26px;height:26px;border-radius:6px;background:#2a3140;display:inline-flex;align-items:center;justify-content:center;font-size:16px;}
.dbox .say{font-size:14px;line-height:1.55;min-height:42px;}
.dbox .choices{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.dbox .choices .btn{justify-content:flex-start;text-align:left;}
.dbox .cont{color:var(--dim);font-size:11px;text-align:right;margin-top:6px;}

/* ── shop / inventory list ── */
.shoptabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
.itemrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--panel2);text-align:left;}
.itemrow .ico{font-size:20px;width:26px;text-align:center;}
.itemrow .info{flex:1;min-width:0;}
.itemrow .nm{font-size:13px;font-weight:700;}
.itemrow .ds{font-size:10.5px;color:var(--muted);line-height:1.4;}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:10px;background:rgba(232,194,74,.16);color:var(--gold);}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px;margin:8px 0;text-align:left;}
.statgrid b{color:var(--gold);}

/* damage vignette + flashes (full-screen fx) */
#fx{position:absolute;inset:0;z-index:30;pointer-events:none;}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(150,0,0,0);transition:box-shadow .25s;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;}

/* fullscreen minigames + back button */
#ovl.mgfull .scrim{background:rgba(5,7,11,.97);backdrop-filter:none;}
#ovl.mgfull .panel{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0;border:0;box-shadow:none;padding:54px 10px 18px;justify-content:flex-start;background:linear-gradient(#0e121a,#06080c);}
#mgback{position:absolute;left:12px;top:11px;z-index:3;display:none;}
#ovl.mgfull #mgback{display:inline-flex;}

/* loading screen */
#loader{position:absolute;inset:0;z-index:60;background:radial-gradient(circle at 50% 38%,#11161f,#05070a 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s;}
#loader.hide{opacity:0;pointer-events:none;}
#loader .lt{font-size:clamp(26px,6.5vw,54px);color:var(--gold);text-align:center;}
#loader .by{color:#cfd6df;margin-top:12px;letter-spacing:3px;font-size:13px;}
#loader .lb{margin-top:24px;width:min(280px,68vw);height:8px;border-radius:6px;background:#1b2029;overflow:hidden;border:1px solid var(--line);}
#loader .lb>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8c24a,#b8902f);animation:ld 1.5s ease forwards;}
@keyframes ld{from{width:0}to{width:100%}}

.hidden{display:none!important;}
.kbd{font-family:var(--mono);background:#222936;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;}
</style>
</head>
<body>
<div id="game"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="loader"><div class="lt arcade glow">DUNGEON QUEST 3D</div><div class="by arcade">A game by Aran</div><div class="lb"><i></i></div></div>
  <div id="fx"><div id="vig"></div><div id="flash"></div></div>
  <div id="hud" class="hidden">
    <div class="meta arcade glow" id="meta"></div>
    <div class="topleft" id="bars"></div>
    <div class="topright"><canvas id="minimap" width="132" height="132"></canvas></div>
    <div id="objective"></div>
    <div id="log"></div>
    <div id="interact"></div>
  </div>
  <div id="touch" class="hidden">
    <div id="stick"><div class="nub"></div></div>
    <div class="toprow" id="toprow"></div>
    <div class="actbtns" id="actbtns"></div>
  </div>
  <div id="dialogue"><div class="dbox">
    <div class="who"><span class="por" id="dpor">🙂</span><span id="dwho">NPC</span></div>
    <div class="say" id="dsay"></div>
    <div class="choices" id="dchoices"></div>
    <div class="cont" id="dcont">▶ tap / Space</div>
  </div></div>
  <div class="overlay" id="ovl"><div class="scrim"></div><button class="btn small" id="mgback">← Back</button><div class="panel" id="ovlpanel"></div></div>
</div></div>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   DUNGEON QUEST 3D — core
   ════════════════════════════════════════════════════════════════════ */
var TS=1;                         // world is in tile units
var FOV=Math.PI/3;                // 60°
var HALF_FOV=FOV/2;
var RAYDPP=1;                     // ray density handled by NR below

/* render buffer (internal); CSS scales it to the stage */
var BW=720, BH=450;               // 16:10 — high internal resolution
var NR=BW;                        // one ray per buffer column (High); halved in Fast

var cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
var mmc=document.getElementById('minimap'), mmx=mmc.getContext('2d');
var stageEl=document.getElementById('stage');

/* offscreen render target we composite into, then blit to the visible canvas */
var rb=document.createElement('canvas'); rb.width=BW; rb.height=BH;
var rbx=rb.getContext('2d',{alpha:false});
/* floor/ceiling cast into a half-res image then scaled up */
var FBW=BW>>1, FBH=BH>>1;
var fbuf=document.createElement('canvas'); fbuf.width=FBW; fbuf.height=FBH;
var fbx=fbuf.getContext('2d'); var fimg=fbx.createImageData(FBW,FBH);

function fitCanvas(){
  var r=stageEl.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(2,Math.round(r.width*dpr)); cv.height=Math.max(2,Math.round(r.height*dpr));
  ctx.imageSmoothingEnabled=true;
}
window.addEventListener('resize',fitCanvas);
window.addEventListener('orientationchange',function(){setTimeout(fitCanvas,300);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitCanvas);

/* ── math/util ── */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(n){return Math.random()*n;}
function rndi(n){return Math.floor(Math.random()*n);}
function chance(p){return Math.random()<p;}
function pick(a){return a[rndi(a.length)];}
function dist2(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
function dist(ax,ay,bx,by){return Math.sqrt(dist2(ax,ay,bx,by));}
function norm(a){while(a<-Math.PI)a+=Math.PI*2;while(a>Math.PI)a-=Math.PI*2;return a;}
function angTo(ax,ay,bx,by){return Math.atan2(by-ay,bx-ax);}
function now(){return performance.now();}

/* ── global game state ── */
var G={
  mode:'boot',          // boot|menu|class|town|dungeon|dialogue|shop|inv|pause|over|win
  prevMode:null,
  level:null,           // current level object {map,W,H,theme,...}
  area:'town',          // 'town' or 'dungeon'
  floor:0,              // dungeon floor index (0 = town gate target floor 1)
  px:2.5,py:2.5,ang:0,  // camera
  vx:0,vy:0,            // smoothed movement (for head-bob)
  bob:0, shake:0, hitstop:0, flash:0, vignette:0,
  entities:[], particles:[], projectiles:[], pickups:[], decals:[],
  zbuf:new Float32Array(NR),
  P:null,               // player character
  keys:{}, input:{f:0,b:0,l:0,r:0,sl:0,sr:0,turnL:0,turnR:0},
  lookDX:0,
  attackHeld:false, blockHeld:false,
  atkCd:0, abilCd:0, castCd:0, swing:0, swingType:null, drawT:0, rollT:0, blockT:0,
  invuln:0,
  msgs:[], objective:'',
  time:0, paused:false, started:false,
  quality:1,            // 1=High (floor casting), 0=Fast
  muted:false, volume:0.7, musicOff:false,
  save:null,
  flags:{},             // world flags: doors opened, gates, quests, keys
  fps:60, _facc:0, _fct:0
};

/* persistence */
var SAVE_KEY='dq3d_v2';
function loadSave(){try{var r=localStorage.getItem(SAVE_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function writeSave(obj){try{localStorage.setItem(SAVE_KEY,JSON.stringify(obj));}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadBest(){try{return parseInt(localStorage.getItem('dq3d_best')||'0',10)||0;}catch(e){return 0;}}
function saveBest(s){try{if(s>loadBest())localStorage.setItem('dq3d_best',String(s));}catch(e){}}

/* tiny message log */
function logMsg(t,col){G.msgs.push({t:t,col:col||'#cfd6df',life:5});if(G.msgs.length>30)G.msgs.shift();renderLog();}
function renderLog(){
  var el=document.getElementById('log'); if(!el)return; el.innerHTML='';
  var v=G.msgs.slice(-4);
  for(var i=0;i<v.length;i++){var d=document.createElement('div');d.textContent=v[i].t;d.style.color=v[i].col;d.style.opacity=String(0.55+0.45*(i+1)/v.length);el.appendChild(d);}
}
/* ════════════════════════════════════════════════════════════════════
   AUDIO — fully procedural (Web Audio API). No files. Starts on first
   user gesture. SFX + a lookahead-scheduled adaptive music sequencer.
   ════════════════════════════════════════════════════════════════════ */
var AC=null, MASTER=null, MUSGAIN=null, SFXGAIN=null, audioOK=false;
var MUSIC_VOL=0.34;   // base music level — kept low so it underscores rather than nags
function m2f(m){return 440*Math.pow(2,(m-69)/12);}

function initAudio(){
  if(AC) { if(AC.state==='suspended')AC.resume(); return; }
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return;
    AC=new Ctx();
    MASTER=AC.createGain(); MASTER.gain.value=G.muted?0:G.volume; MASTER.connect(AC.destination);
    MUSGAIN=AC.createGain(); MUSGAIN.gain.value=G.musicOff?0:MUSIC_VOL; MUSGAIN.connect(MASTER);
    SFXGAIN=AC.createGain(); SFXGAIN.gain.value=0.95; SFXGAIN.connect(MASTER);
    audioOK=true;
    startMusicClock();startAmbientClock();
  }catch(e){audioOK=false;}
}
function setVolume(v){G.volume=clamp(v,0,1);if(MASTER)MASTER.gain.value=G.muted?0:G.volume;}
function setMuted(m){G.muted=m;if(MASTER)MASTER.gain.value=m?0:G.volume;}
function setMusicMuted(m){G.musicOff=m;if(MUSGAIN)MUSGAIN.gain.value=m?0:MUSIC_VOL;}

/* a single voice: osc -> gain(env) -> dest */
function voice(freq,t0,dur,type,vol,dest,glide){
  if(!audioOK)return;
  var o=AC.createOscillator(), g=AC.createGain();

function setMusic(name){
  if(MUS.track===name)return;
  MUS.track=name; MUS.step=0;
  if(audioOK){MUS.bpm=(TRACKS[name]&&TRACKS[name].bpm)||96; MUS.next=AC.currentTime+0.05;}
}
function startMusicClock(){
  if(MUS.timer)return;
  MUS.timer=setInterval(function(){
    if(!audioOK||MUS.track==='none'||MUS.track==='off')return;
    var tk=TRACKS[MUS.track]; if(!tk)return;
    var spb=60/MUS.bpm/2;                 // eighth-note steps
    var ahead=AC.currentTime+0.12;
    while(MUS.next<ahead){
      var t=MUS.next, s=MUS.step%16, bar=Math.floor(MUS.step/2)%8;
      // bass on every quarter
      if(s%2===0){voice(m2f(tk.root+tk.bass[bar]-12),t,spb*1.9,'triangle',0.2,MUSGAIN);}
      // lead: one flowing note per quarter, soft triangle, 16-note phrase (repeats only every 4 bars)
      if(tk.lead && s%2===0){var ln=tk.lead[Math.floor(MUS.step/2)%tk.lead.length];voice(m2f(tk.root+ln),t,spb*1.7,'triangle',0.05,MUSGAIN);}
      // pad chord at bar starts
      if(tk.pad && s===0){[0,4,7].forEach(function(iv){voice(m2f(tk.root+iv),t,spb*7,'sine',0.05,MUSGAIN);});}
      // drums — softened so they pulse rather than thump
      if(tk.drums){ if(s%4===0)noise(t,0.1,0.12,250); if(s%4===2)noise(t,0.04,0.07,6000); }
      MUS.next+=spb; MUS.step++;
    }
  },25);
}

function mkc(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}

function texBrick(pal){
  var c=mkc(64,64),x=c.getContext('2d');
  x.fillStyle=pal[1];x.fillRect(0,0,64,64);
  var bh=16;
  for(var row=0;row<4;row++){
    var off=(row%2)*16;
    for(var bx=-16;bx<64;bx+=32){
      var px2=bx+off+1, py=row*bh+1;
      var shade=0.85+Math.random()*0.3;
      x.fillStyle=shadeHex(pal[0],shade);x.fillRect(px2,py,30,bh-2);
      x.fillStyle=shadeHex(pal[2],1);x.fillRect(px2,py,30,2);          // top highlight
      x.fillStyle=shadeHex(pal[1],0.7);x.fillRect(px2,py+bh-3,30,2);   // bottom shadow
    }
  }
  noisePx(x,420,64,64,120);
  return c;
}
function texDoor(){

function newGame(cls){G.P=makePlayer(cls);G.view='fp';G.flags={questMain:0,board:{},story:0,visited:{},totalKills:0,goldEarned:0,found:{}};G.buff={regen:0,xp:0};G.weather='clear';G.weatherT=24;G.thunderT=8;G.started=true;G.transition=0;G.transDir=0;enterLevel(START_LEVEL);}

/* ── story gate: enforce chapter order so you can't reach the Lich King first ── */
function storyGate(to){
  /* The world is open: stairs, caves and the deep stair are always walkable.
     The 15-chapter tale (press J) is optional flavour layered on top of free
     exploration — it no longer bars the way down. Delve whenever you dare. */
  return null;}
/* helpers: is a descent / portal currently locked by the story? (used to HIDE it, not deny it) */
function caveDownLocked(){var L=LEVELS[G.curKey];return !!(L&&L.linkDown&&storyGate(L.linkDown));}
function portalLocked(p){return !!(p&&p.to&&storyGate(p.to));}
function thingGated(t){if(!t||!t.linkTo)return false;return t.linkTo==='__down'?caveDownLocked():!!storyGate(t.linkTo);}
function caveDescend(){var t=LEVELS[G.curKey].linkDown;if(!t)return;var g=storyGate(t);if(g){if(sfx.deny)sfx.deny();logMsg(g,'#d9433f');return;}G.stairDir=-1;startTransition('Descending the steps…',function(){enterLevel(t,{entry:'down'});});}
function caveAscend(){var t=LEVELS[G.curKey].linkUp;if(!t)return;G.stairDir=1;startTransition('Climbing the steps…',function(){enterLevel(t,{entry:'up'});});}
function travelPortal(p){var g=storyGate(p.to);if(g){if(sfx.deny)sfx.deny();logMsg(g,'#d9433f');return;}var from=G.curKey;G.stairDir=0;startTransition(p.label||'…',function(){enterLevel(p.to,{back:from});});}
function saveGame(){if(!G.P)return;writeSave({P:JSON.parse(JSON.stringify(G.P)),levelKey:G.curKey,flags:G.flags,ts:Date.now()});}
function boardState(id){if(!G.flags.board)G.flags.board={};var b=G.flags.board[id];if(!b){b={active:0,prog:0,done:0,claimed:0};G.flags.board[id]=b;}return b;}

function updateWeather(dt){if(G.weatherT==null)G.weatherT=24;G.weatherT-=dt;if(G.weatherT<=0){G.weatherT=34+rnd(46);var prev=G.weather;G.weather=pick(['clear','clear','clear','rain','fog']);if(G.weather!==prev){if(G.weather==='rain'){logMsg('Rain sweeps in over the land.','#9ab4d6');}else if(G.weather==='fog'){logMsg('A grey fog rolls in.','#aab4c0');}else logMsg('The skies clear.','#cfe0ee');}}if(G.weather==='rain'&&G.level&&G.level.outdoor){G.thunderT=(G.thunderT||6)-dt;if(G.thunderT<=0){G.thunderT=14+rnd(22);lightningFlash();if(sfx.thunder)sfx.thunder();}}}

function gainXp(n){var P=G.P;if(G.buff&&G.buff.xp>0)n=Math.round(n*1.5);P.xp+=n;while(P.xp>=P.xpNext){P.xp-=P.xpNext;P.level++;P.xpNext=Math.round(P.xpNext*1.5);var g={knight:[26,4,12,3,2],ranger:[17,9,16,3,1],mage:[12,18,7,2,1]}[P.cls];P.hpMax+=g[0];P.mpMax+=g[1];P.staMax+=g[2];P.atk+=g[3];P.def+=g[4];P.hp=P.hpMax;P.mp=P.mpMax;P.sta=P.staMax;logMsg('★ LEVEL UP! You are now level '+P.level+'.','#ffd24a');sfx.levelup();spawnBurst(G.px+Math.cos(G.ang)*0.5,G.py+Math.sin(G.ang)*0.5,'#ffd24a',26);floater(G.px,G.py,'LEVEL '+P.level,'#ffd24a',1.4);}}

function goalPos(){var L=G.level;if(!L)return null;var s=(G.flags&&G.flags.story!=null)?G.flags.story:0,i,n,pp;
  /* underground: the boss, else the (unlocked) deep stair, else the nearest foe, else back up */
  if(G.area==='cave'){
    for(i=0;i<G.enemies.length;i++)if(G.enemies[i].boss&&G.enemies[i].hp>0)return {x:G.enemies[i].x,y:G.enemies[i].y};
    if(L.caveDown&&!caveDownLocked())return {x:L.caveDown.x,y:L.caveDown.y};
    var ce=nearestEnemy(G.px,G.py,999);if(ce)return {x:ce.x,y:ce.y};
    if(L.caveUp)return {x:L.caveUp.x,y:L.caveUp.y};
    return null;}
  /* the overworld: follow the current chapter to a place you can actually reach */
  if(G.curKey==='world'){
    if(s<=0||!G.flags||!G.flags.questMain){for(i=0;i<G.npcs.length;i++){n=G.npcs[i];if(n.def&&n.def.action==='quest')return {x:n.x,y:n.y};}}
    var asi=(typeof activeSite==='function')?activeSite():null;if(asi&&G.sitePos&&G.sitePos[asi.id])return G.sitePos[asi.id];  // investigation chapter → the site to examine
    if(s===11){pp=portalPos(L,'cave2');if(pp&&!storyGate('cave2'))return pp;}
    if(s>=9&&L.caveDown&&!caveDownLocked())return {x:L.caveDown.x,y:L.caveDown.y};
    var we=nearestEnemy(G.px,G.py,999);if(we)return {x:we.x,y:we.y};   // war chapters → nearest foe

  if(G.curKey==='harbor'){

    pp=portalPos(L,'world');if(pp)return pp;return null;}
  /* interiors: point at the way out */
  pp=portalPos(L,'world');if(pp)return pp;

function damageEnemy(e,dmg,crit){if(e.hp<=0)return;e.hp-=dmg;e.hurtT=0.18;e.aggro_on=true;if(e.state==='idle')e.state='chase';floater(e.x,e.y-0.1,String(Math.round(dmg)),crit?'#ffd24a':'#ffffff',0.7);spawnBlood(e.x,e.y);G.hitstop=Math.max(G.hitstop,crit?0.07:0.04);(crit?sfx.crit:sfx.hit)();if(e.hp<=0)killEnemy(e);}

function comboCheck(){var c=G.combo,t=null;if(c===3)t='TRIPLE KILL!';else if(c===5)t='RAMPAGE!';else if(c===8)t='UNSTOPPABLE!';else if(c===12)t='G O D L I K E!';else if(c>12&&c%5===0)t='COMBO ×'+c+'!';if(t){G.callout=t;G.calloutT=1.6;sfx.crit();spawnBurst(G.px+Math.cos(G.ang)*0.6,G.py+Math.sin(G.ang)*0.6,'#ffd24a',20);}}
function killEnemy(e){e.hp=0;e.state='dead';e.dieT=0;e.aggro_on=false;G.combo=(G.combo||0)+1;G.comboT=3.2;comboCheck();var _m=comboMult(),_g=Math.round(e.gold*_m),_x=Math.round(e.xp*_m);gainXp(_x);G.P.gold+=_g;if(G.flags){G.flags.totalKills=(G.flags.totalKills||0)+1;G.flags.goldEarned=(G.flags.goldEarned||0)+_g;}logMsg('Defeated '+e.name+'  (+'+_x+' XP, +'+_g+'g'+(_m>1?'  ×'+_m+' COMBO':'')+')','#cfd6df');floater(e.x,e.y,'+'+_g+'g'+(_m>1?' ×'+_m:''),'#e8c24a',1.0);sfx.die();spawnBurst(e.x,e.y,'#6a3a3a',10);questProgress('kill',e.type,1);questProgress('gold',null,_g);if(chance(0.25)){var r=Math.random();G.things.push({kind:'thing',t:r<0.6?'hp':(r<0.85?'mp':'gold'),x:e.x,y:e.y,taken:false,amt:8+rndi(16)});}if(e.boss)victory();}
function hurtPlayer(dmg){if(G.invuln>0||G.rollT>0)return;var d=dmg;if(G.P.cls==='knight'&&G.blockHeld&&G.P.sta>0){d*=0.3;G.P.sta=Math.max(0,G.P.sta-14);sfx.thunk();}d=d*30/(30+totalDef());d=Math.max(1,Math.round(d));G.P.hp-=d;G.invuln=0.45;G.shake=Math.max(G.shake,6);flashFX(0.5);sfx.hurt();if(G.P.hp<=0){G.P.hp=0;death();}}

function pressAttack(){if(!worldActive())return;G._atk=true;var P=G.P;if(P.cls==='ranger'){if(G.atkCd<=0){G.drawing=true;if(G.drawT===0)sfx.bow();}return;}if(G.atkCd>0)return;if(P.cls==='knight'){G.atkCd=0.42;G.swing=1;sfx.swing();var dirX=Math.cos(G.ang),dirY=Math.sin(G.ang),hit=false;for(var i=0;i<G.enemies.length;i++){var e=G.enemies[i];if(e.hp<=0)continue;var dx=e.x-G.px,dy=e.y-G.py,dd=Math.hypot(dx,dy);if(dd>1.6)continue;if((dx/dd)*dirX+(dy/dd)*dirY<0.35)continue;var crit=chance(0.14);damageEnemy(e,(totalAtk())*(0.85+rnd(0.3))*(crit?2:1),crit);hit=true;}var sm=smashFront();if(!hit&&!sm)floater(G.px+dirX*0.9,G.py+dirY*0.9,'miss','#9aa0ad',0.5);}else if(P.cls==='mage'){if(P.mp<6){sfx.deny();floater(G.px+Math.cos(G.ang)*0.5,G.py+Math.sin(G.ang)*0.5,'no MP','#6bf',0.6);return;}P.mp-=6;G.atkCd=0.34;G.swing=1;G.castGlow=1;sfx.cast();G.projectiles.push({kind:'proj',owner:'player',ptype:'bolt',x:G.px,y:G.py,dx:Math.cos(G.ang),dy:Math.sin(G.ang),spd:9,life:1.8,dmg:boltDmg(),aoe:0});}}
function releaseAttack(){var P=G.P;if(P.cls!=='ranger'||!G.drawing)return;G.drawing=false;var charge=clamp(G.drawT,0,1);G.drawT=0;G.atkCd=0.28;G.projectiles.push({kind:'proj',owner:'player',ptype:'arrow',x:G.px,y:G.py,dx:Math.cos(G.ang),dy:Math.sin(G.ang),spd:11+charge*5,life:1.6,dmg:(WEAPONS[P.weaponIdx].dmg*0.6+P.atk+4)*(0.6+charge*1.7),aoe:0,crit:charge>0.85});sfx.arrow();}

/* ── dig & smash — break destructible props (barrels/rocks/bushes), drop loot, clear the tile ── */
function smashTile(tx,ty){var L=G.level;if(tx<0||ty<0||tx>=L.W||ty>=L.H||L.propSolid[ty][tx]!==1)return false;
  for(var i=0;i<G.things.length;i++){var t=G.things[i];if(t.taken)continue;if((t.x|0)===tx&&(t.y|0)===ty&&(t.t==='barrel'||t.t==='rock'||t.t==='bush')){
    t.taken=true;L.propSolid[ty][tx]=0;sfx.thunk();G.shake=Math.max(G.shake,4);spawnBoom(t.x,t.y,t.t==='rock'?'#9aa0ab':(t.t==='bush'?'#3f8540':'#8a5a2a'));floater(t.x,t.y-0.1,'SMASH!','#ffd24a',0.7);
    if(chance(0.6)){var r=Math.random();G.things.push({kind:'thing',t:r<0.55?'gold':(r<0.8?'hp':'mp'),x:t.x,y:t.y,taken:false,amt:6+rndi(14)});}
    return true;}}
  return false;}
function smashFront(){var dirX=Math.cos(G.ang),dirY=Math.sin(G.ang),hit=false;for(var d=0.6;d<=1.3;d+=0.5){if(smashTile((G.px+dirX*d)|0,(G.py+dirY*d)|0))hit=true;}return hit;}
function nearestEnemy(x,y,rng){var best=null,bd=rng*rng;for(var i=0;i<G.enemies.length;i++){var e=G.enemies[i];if(e.hp<=0)continue;var dd=dist2(e.x,e.y,x,y);if(dd<bd){bd=dd;best=e;}}return best;}
function updateGadgets(dt){var P=G.P;G.companions=[];if(!P||!P.gadgets)return;
  if(P.gadgets.drone){G._droneAng=(G._droneAng||0)+dt*1.3;var dx=G.px+Math.cos(G._droneAng)*0.95,dy=G.py+Math.sin(G._droneAng)*0.95;G.companions.push({kind:'thing',t:'drone',x:dx,y:dy,fly:true});G._droneCd=(G._droneCd||0)-dt;if(G._droneCd<=0){var e=nearestEnemy(dx,dy,8);if(e){var dd=dist(dx,dy,e.x,e.y)||1;G._droneCd=1.2;G.projectiles.push({kind:'proj',owner:'player',ptype:'bolt',x:dx,y:dy,dx:(e.x-dx)/dd,dy:(e.y-dy)/dd,spd:9,life:1.6,dmg:boltDmg()*0.7,aoe:0});if(chance(0.5))sfx.bow();}}}

  if(P.gadgets.medbot){var mx=G.px-Math.cos(G.ang)*0.55,my=G.py-Math.sin(G.ang)*0.55;G.companions.push({kind:'thing',t:'medbot',x:mx,y:my,fly:true});if(P.hp<P.hpMax)P.hp=Math.min(P.hpMax,P.hp+dt*2.4);}
  if(P.gadgets.butler){var bx=G.px-Math.cos(G.ang)*0.85-Math.sin(G.ang)*0.4,by=G.py-Math.sin(G.ang)*0.85+Math.cos(G.ang)*0.4;G.companions.push({kind:'thing',t:'butler',x:bx,y:by});G._butCd=(G._butCd||0)-dt;if(P.hp<P.hpMax*0.35&&P.inv.hp>0&&G._butCd<=0){G._butCd=5;usePotion('hp');floater(bx,by,'“For you, sir.”','#bfe0ff',1.3);}}}

function updateProjectiles(dt){for(var i=0;i<G.projectiles.length;i++){var p=G.projectiles[i];if(p.dead)continue;p.life-=dt;var nx=p.x+p.dx*p.spd*dt,ny=p.y+p.dy*p.spd*dt;var die=p.life<=0||solidAt(nx,ny);if(propAt(nx,ny)){if(p.owner==='player'){if(smashTile(nx|0,ny|0))die=true;/* else (tree/lamp): fly through */}else die=true;}if(die){p.dead=true;if(p.aoe>0)explode(p.x,p.y,p.dmg,p.aoe,p.owner);else if(p.owner==='player')spawnBurst(p.x,p.y,'#cfd6df',4);continue;}p.x=nx;p.y=ny;if(p.owner==='player'&&Math.random()<0.6)G.particles.push({x:p.x,y:p.y,z:0.45,vx:0,vy:0,vz:0,life:0.2,max:0.2,color:p.ptype==='fire'?'#ff9a3a':(p.ptype==='bolt'?'#b06bff':'#caa'),size:0.6});if(p.owner==='player'){for(var j=0;j<G.enemies.length;j++){var e=G.enemies[j];if(e.hp>0&&dist2(e.x,e.y,p.x,p.y)<(e.range*0.4+0.25)*(e.range*0.4+0.25)){p.dead=true;if(p.aoe>0)explode(p.x,p.y,p.dmg,p.aoe,'player');else damageEnemy(e,p.dmg,p.crit);break;}}}else{if(dist2(G.px,G.py,p.x,p.y)<0.3&&G.pz<0.4){p.dead=true;hurtPlayer(p.dmg);}}}G.projectiles=G.projectiles.filter(function(p){return !p.dead;});}
function explode(x,y,dmg,rad,owner){spawnBoom(x,y,'#ff9a3a');sfx.boom();G.shake=Math.max(G.shake,7);if(owner==='player'){for(var i=0;i<G.enemies.length;i++){var e=G.enemies[i];if(e.hp>0&&dist2(e.x,e.y,x,y)<rad*rad)damageEnemy(e,dmg*(0.6+0.4*(1-dist(e.x,e.y,x,y)/rad)),false);}}else{if(dist2(G.px,G.py,x,y)<rad*rad)hurtPlayer(dmg);}}
function updateEnemies(dt){for(var i=0;i<G.enemies.length;i++){var e=G.enemies[i];e.anim+=dt;if(e.hp<=0){e.dieT=(e.dieT||0)+dt;continue;}if(e.hurtT>0)e.hurtT-=dt;var d=dist(e.x,e.y,G.px,G.py);if(!e.aggro_on&&d<e.aggro)e.aggro_on=true;if(e.atkCd>0)e.atkCd-=dt;if(e.boss){updateBoss(e,dt,d);continue;}if(!e.aggro_on){e.state='idle';continue;}if(e.state==='wind'){e.t-=dt;if(e.t<=0){if(e.caster)G.projectiles.push({kind:'proj',owner:'enemy',ptype:'dark',x:e.x,y:e.y,dx:(G.px-e.x)/(d||1),dy:(G.py-e.y)/(d||1),spd:5,life:3,dmg:e.atk,aoe:0});else if(d<e.range+0.3&&G.pz<0.4)hurtPlayer(e.atk);e.atkCd=e.cd;e.state='chase';}continue;}if(e.caster&&d<e.aggro&&d>1.2){if(e.atkCd<=0){e.state='wind';e.t=e.windup;}else moveTowards(e,G.px,G.py,e.spd*0.4,dt);continue;}if(d>e.range)moveTowards(e,G.px,G.py,e.spd,dt),e.state='chase';else if(e.atkCd<=0){e.state='wind';e.t=e.windup;}}G.enemies=G.enemies.filter(function(e){return e.hp>0||(e.dieT||0)<0.7;});}
function moveTowards(e,tx,ty,sp,dt){var dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;var nx=e.x+dx/d*sp*dt,ny=e.y+dy/d*sp*dt;if(e.fly){if(!solidAt(nx,e.y))e.x=nx;if(!solidAt(e.x,ny))e.y=ny;return;}if(!blockedAt(nx,e.y,0.26))e.x=nx;if(!blockedAt(e.x,ny,0.26))e.y=ny;}
function updateBoss(e,dt,d){e.aggro_on=true;if(e.state==='wind'){e.t-=dt;if(e.t<=0){var n=e.hp<e.hpMax*0.5?3:1,base=Math.atan2(G.py-e.y,G.px-e.x);for(var k=0;k<n;k++){var a=base+(k-(n-1)/2)*0.25;G.projectiles.push({kind:'proj',owner:'enemy',ptype:'dark',x:e.x,y:e.y,dx:Math.cos(a),dy:Math.sin(a),spd:5,life:3.5,dmg:e.atk,aoe:0});}e.atkCd=e.cd;e.state='chase';}return;}e.summonT-=dt;if(e.hp<e.hpMax*0.6&&e.summonT<=0){e.summonT=10;var cnt=0;for(var i=0;i<G.enemies.length;i++)if(G.enemies[i].type==='skel'&&G.enemies[i].hp>0)cnt++;if(cnt<3){var sk=makeEnemy('skel',e.x+rnd(2)-1,e.y+rnd(2)-1);sk.aggro_on=true;G.enemies.push(sk);logMsg('The Lich raises the dead!','#c44ad0');}}if(d>3)moveTowards(e,G.px,G.py,e.spd,dt);if(e.atkCd<=0){e.state='wind';e.t=e.windup;}}
function updateCitizens(dt){for(var i=0;i<G.npcs.length;i++){var n=G.npcs[i];if(!n.def.wander)continue;n.moving=false;if(n.wt>0){n.wt-=dt;continue;}if(!n.dir||chance(0.01)){var a=rnd(6.28);n.dir={x:Math.cos(a),y:Math.sin(a)};if(chance(0.3)){n.wt=0.5+rnd(1.5);continue;}}var sp=0.7,nx=n.x+n.dir.x*sp*dt,ny=n.y+n.dir.y*sp*dt,moved=false;if(!blockedAt(nx,n.y,0.22)){n.x=nx;moved=true;}else n.dir.x*=-1;if(!blockedAt(n.x,ny,0.22)){n.y=ny;moved=true;}else n.dir.y*=-1;n.moving=moved;n.anim=(n.anim||0)+dt;}}

/* ── Aerial support: summon a bombing run on the foes around you (own cooldown,
   nothing to do with the flight sim). Press G or tap the ✈ HUD button. ── */
function callAirstrike(){
  if(!worldActive())return;
  if((G.airstrikeCd||0)>0){if(sfx.deny)sfx.deny();floater(G.px,G.py-0.2,'air support rearming ('+Math.ceil(G.airstrikeCd)+'s)','#9fb6d0',0.85);return;}
  var R=9,targets=[],i;
  for(i=0;i<G.enemies.length;i++){var e=G.enemies[i];if(e.hp>0&&dist2(e.x,e.y,G.px,G.py)<R*R)targets.push(e);}
  if(!targets.length){if(sfx.deny)sfx.deny();floater(G.px,G.py-0.2,'no targets in range','#9fb6d0',0.85);return;}
  G.airstrikeCd=28;
  var run={t:0,dur:3.4,bombs:[],planes:[]};
  for(i=0;i<targets.length;i++)run.bombs.push({e:targets[i],t:0.55+i*0.26+Math.random()*0.12,done:false});
  for(i=0;i<3;i++)run.planes.push({off:i*0.22,lane:(i-1)});
  G.airstrike=run;
  logMsg('Air support inbound — '+targets.length+' target'+(targets.length>1?'s':'')+' marked!','#7fd0ff');
  G.callout='AIR SUPPORT';G.calloutT=1.8;if(sfx.quest)sfx.quest();
}
function updateAirstrike(dt){
  var a=G.airstrike;if(!a)return;a.t+=dt;
  for(var i=0;i<a.bombs.length;i++){var b=a.bombs[i];if(b.done||a.t<b.t)continue;b.done=true;
    var e=b.e;if(e&&e.hp>0){damageEnemy(e,Math.max(70,e.hpMax*0.8),true);spawnBurst(e.x,e.y,'#ffc24a',18);spawnBurst(e.x,e.y,'#6a6a6a',12);}
    G.shake=Math.max(G.shake,8);if(typeof flashFX==='function')flashFX(0.3);if(sfx.boom)sfx.boom();}
  if(a.t>=a.dur)G.airstrike=null;
}
function drawAirstrike(x,horiz){
  var a=G.airstrike;if(!a)return;
  for(var i=0;i<a.planes.length;i++){var pl=a.planes[i];
    var pp=(a.t-pl.off)/(a.dur*0.8);if(pp<0||pp>1.15)continue;
    var sx=-70+pp*(BW+140),sy=horiz*0.34+pl.lane*26;
    x.save();x.translate(sx,sy);
    x.fillStyle='rgba(255,250,230,0.35)';x.fillRect(-34,-1,18,2);
    x.fillStyle='rgba(36,42,54,0.95)';
    x.beginPath();x.moveTo(16,0);x.lineTo(-12,-4);x.lineTo(-16,0);x.lineTo(-12,4);x.closePath();x.fill();
    x.fillRect(-7,-13,4,26);
    x.fillStyle='rgba(180,70,70,0.95)';x.fillRect(15,-1,3,2);
    x.restore();}
}
function update(dt){
  G.time+=dt; G.tod=((G.tod||0.34)+dt/200)%1;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*22);if(G.swing>0)G.swing=Math.max(0,G.swing-dt*3.2);if(G.castGlow>0)G.castGlow=Math.max(0,G.castGlow-dt*2.5);
  if(G.invuln>0)G.invuln-=dt;if(G.rollT>0)G.rollT-=dt;if(G.atkCd>0)G.atkCd-=dt;if(G.abilCd>0)G.abilCd-=dt;if(G.hitstop>0)G.hitstop-=dt;if(G.stairCd>0)G.stairCd-=dt;if(G.airstrikeCd>0){G.airstrikeCd-=dt;if(G.airstrikeCd<=0){G.airstrikeCd=0;logMsg('✈ Air support ready.','#8fe0b0');}}if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}if(G.calloutT>0)G.calloutT-=dt;
  if(G.transDir>0){G.transition+=dt*3;if(G.stairDir)G.pz+=((G.stairDir*0.5)-G.pz)*dt*6;if(G.transition>=1){G.transition=1;var cb=G.transCb;G.transCb=null;G.stairDir=0;if(cb)cb();G.transDir=-1;}return;}
  if(G.transDir<0){G.transition-=dt*2.4;if(G.transition<=0){G.transition=0;G.transDir=0;G.transLabel='';}}
  if(!worldActive())return;
  var P=G.P;G.ang=norm(G.ang+G.lookDX*LOOKSENS*G.sens+G.mv.turn*TURNSP*G.sens*dt);G.lookDX=0;
  if(!G.onGround||G.vz>0){G.vz-=GRAV*dt;G.pz+=G.vz*dt;if(G.pz<=0){G.pz=0;G.vz=0;if(!G.onGround&&sfx.land)sfx.land();G.onGround=true;}}
  if(G.drawing)G.drawT=Math.min(1,G.drawT+dt*1.6);
  movement(dt);
  P.sta=Math.min(P.staMax,P.sta+dt*(G.blockHeld?4:16));P.mp=Math.min(P.mpMax,P.mp+dt*(P.cls==='mage'?4:1.5));
  if(G.buff){if(G.buff.regen>0){G.buff.regen-=dt;P.hp=Math.min(P.hpMax,P.hp+dt*5);}if(G.buff.xp>0)G.buff.xp-=dt;}
  updateWeather(dt);
  if(G.hitstop<=0){updateEnemies(dt);updateProjectiles(dt);}
  G.wade+=((regionAt(G.px,G.py)==='water'?1:0)-(G.wade||0))*Math.min(1,dt*6);
  updateGadgets(dt);updateCitizens(dt);updateParticles(dt);updateThings(dt);updateAirstrike(dt);spawnAmbient(dt);scanInteract();tickTutorial(dt);tickStory();updateHUD();

function mblock(x,y){if((G.pz||0)>0.35)return solidAt(x-0.18,y-0.18)||solidAt(x+0.18,y-0.18)||solidAt(x-0.18,y+0.18)||solidAt(x+0.18,y+0.18);return blockedAt(x,y);}  /* airborne: hop over props, walls still block */
function movement(dt){var P=G.P,spd=CLASSES[P.cls].spd*(G.rollT>0?2.3:1),mvx,mvy;if(regionAt(G.px,G.py)==='water')spd*=0.6;
  if(G.view==='aerial'){mvx=clamp(G.mv.s+G.mv.turn,-1,1);mvy=-G.mv.f;}                  // overhead: screen-relative, north-up
  else{var dirX=Math.cos(G.ang),dirY=Math.sin(G.ang),rX=-dirY,rY=dirX;mvx=dirX*G.mv.f+rX*G.mv.s;mvy=dirY*G.mv.f+rY*G.mv.s;}
  var ml=Math.hypot(mvx,mvy);if(ml>1){mvx/=ml;mvy/=ml;}
  if(ml>0.05){G._moved=(G._moved||0)+dt;if(G.view==='aerial')G.ang=Math.atan2(mvy,mvx);                            // face the way you move
    var nx=G.px+mvx*spd*dt,ny=G.py+mvy*spd*dt;if(!mblock(nx,G.py))G.px=nx;if(!mblock(G.px,ny))G.py=ny;
    if(G.onGround){var prev=G.bobPhase;G.bobPhase+=dt*spd*2.4;G.bobY=Math.sin(G.bobPhase)*2.6;if(Math.floor(prev/Math.PI)!==Math.floor(G.bobPhase/Math.PI)){var rg=regionAt(G.px,G.py);if(rg==='water')sfx.splash();else sfx.step(rg==='beach'?'sand':((rg==='city'||rg==='cave')?'hard':'soft'));}}
  }else G.bobY*=0.85;}
function updateParticles(dt){for(var i=0;i<G.particles.length;i++){var p=G.particles[i];p.life-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.z=(p.z||0.3)+(p.vz||0)*dt;if(!p.amb)p.vz=(p.vz||0)-6*dt;if(p.z<0)p.z=0;}G.particles=G.particles.filter(function(p){return p.life>0;});}
function updateThings(dt){var L=G.level,i;for(i=0;i<L.doors.length;i++){var dr=L.doors[i];if(!dr.open&&dist2(dr.x+0.5,dr.y+0.5,G.px,G.py)<2.0){dr.open=true;L.wall[dr.y][dr.x]=0;sfx.door();}}
  if(G.stairCd<=0){if(L.caveDown&&!caveDownLocked()&&dist2(L.caveDown.x,L.caveDown.y,G.px,G.py)<0.4)caveDescend();else if(L.caveUp&&dist2(L.caveUp.x,L.caveUp.y,G.px,G.py)<0.4)caveAscend();else{for(i=0;i<L.portals.length;i++){var pt=L.portals[i];if(!portalLocked(pt)&&dist2(pt.x,pt.y,G.px,G.py)<0.4){travelPortal(pt);break;}}}}
  for(i=0;i<G.things.length;i++){var t=G.things[i];if(t.taken)continue;if(t.t==='spike'){if((t.x|0)===(G.px|0)&&(t.y|0)===(G.py|0)&&G.invuln<=0&&G.pz<0.25){hurtPlayer(8);G.invuln=0.7;}continue;}if(t.t==='gold'||t.t==='hp'||t.t==='mp'||t.t==='key'){var _dd=dist2(t.x,t.y,G.px,G.py);if(_dd<5&&_dd>0.2){var _d=Math.sqrt(_dd),_p=Math.min(7,3.5/_d)*dt;t.x+=(G.px-t.x)/_d*_p;t.y+=(G.py-t.y)/_d*_p;}if(dist2(t.x,t.y,G.px,G.py)<0.36){t.taken=true;if(t.t==='gold'){G.P.gold+=t.amt;questProgress('gold',null,t.amt);if(G.flags)G.flags.goldEarned=(G.flags.goldEarned||0)+t.amt;floater(t.x,t.y,'+'+t.amt+'g','#e8c24a');sfx.gold();}else if(t.t==='hp'){G.P.inv.hp++;logMsg('Picked up a health potion.');sfx.potion();}else if(t.t==='mp'){G.P.inv.mp++;logMsg('Picked up a mana potion.');sfx.potion();}else if(t.t==='key'){G.P.keys++;logMsg('Found a key.','#e8c24a');sfx.key();}}}}}

function scanInteract(){var best=null,bd=99,L=G.level,i;function consider(x,y,maxd,type,obj,label){var d=dist2(x,y,G.px,G.py);if(d<maxd*maxd&&d<bd){bd=d;best={type:type,obj:obj,label:label,x:x,y:y};}}for(i=0;i<G.npcs.length;i++){var n=G.npcs[i];consider(n.x,n.y,1.4,'npc',n,'Talk to '+n.def.name);}for(i=0;i<L.venues.length;i++){var v=L.venues[i];consider(v.x,v.y,1.6,'venue',v,v.type==='arcade'?'Enter the Arcade':(v.type==='golf'?'Play Mini-Golf':(v.type==='fish'?'Go Fishing':(v.type==='board'?'Read the Notice Board':(v.type==='plane'?'Board the Airplane ✈':'Play Snake')))));}for(i=0;i<G.things.length;i++){var t=G.things[i];if(t.t==='chest'&&!t.open)consider(t.x,t.y,1.2,'chest',t,'Open chest');else if(t.t==='qsite')consider(t.x,t.y,1.7,'site',t,'Investigate '+t.site.name);}for(i=0;i<L.switches.length;i++){var s=L.switches[i];if(!s.on)consider(s.x,s.y,1.2,'switch',s,'Pull the lever');}for(i=0;i<L.lockeds.length;i++){var lk=L.lockeds[i];if(!lk.open)consider(lk.x+0.5,lk.y+0.5,1.4,'locked',lk,G.P.keys>0?'Unlock door':'Locked — need a key');}if(L.caveDown&&!caveDownLocked())consider(L.caveDown.x,L.caveDown.y,1.3,'down',null,'Descend the steps ▼');if(L.caveUp)consider(L.caveUp.x,L.caveUp.y,1.3,'up',null,'Climb the steps ▲');for(i=0;i<L.portals.length;i++){var pt=L.portals[i];if(!portalLocked(pt))consider(pt.x,pt.y,1.3,'portal',pt,pt.label);}G.interact=best;setInteract(best?best.label:null);}
function doInteract(){var it=G.interact;if(!it)return;G._interacted=true;if(it.type==='npc')openDialogue(it.obj.def);else if(it.type==='venue'){if(it.obj.type==='arcade')openArcade();else if(it.obj.type==='golf')launchMinigame('golf');else if(it.obj.type==='fish')launchMinigame('fish');else if(it.obj.type==='board')openBoard();else if(it.obj.type==='plane')launchMinigame('flight');else launchMinigame('snake');}else if(it.type==='chest')openChest(it.obj);else if(it.type==='site'){if(sfx.blip)sfx.blip();discoverSite(it.obj.site);}else if(it.type==='switch'){it.obj.on=true;openGates();sfx.door();logMsg('A gate grinds open somewhere.','#cfd6df');}else if(it.type==='locked'){if(G.P.keys>0){G.P.keys--;it.obj.open=true;G.level.wall[it.obj.y][it.obj.x]=0;sfx.door();logMsg('You unlock the door.','#e8c24a');}else{sfx.deny();logMsg('The door is locked. Find a key.','#d9433f');}}else if(it.type==='down'){sfx.blip();caveDescend();}else if(it.type==='up'){sfx.blip();caveAscend();}else if(it.type==='portal'){sfx.blip();travelPortal(it.obj);}}
function openGates(){var L=G.level;for(var i=0;i<L.gates.length;i++){var g=L.gates[i];if(!g.open){g.open=true;L.wall[g.y][g.x]=0;}}}
function openChest(t){t.open=true;sfx.chest();var r=Math.random(),P=G.P;if(r<0.34){var g=20+rndi(45);P.gold+=g;logMsg('Chest: '+g+' gold!','#e8c24a');}else if(r<0.58){P.inv.hp+=2;logMsg('Chest: 2 health potions!','#cfd6df');}else if(r<0.76){P.inv.mp+=2;logMsg('Chest: 2 mana potions!','#cfd6df');}else if(r<0.9){if(P.weaponIdx<WEAPONS.length-1){P.weaponIdx++;logMsg('Chest: '+WEAPONS[P.weaponIdx].name+'! Equipped.','#ffd24a');}else{P.gold+=70;logMsg('Chest: 70 gold!','#e8c24a');}}else{if(P.armorIdx<ARMORS.length-1){P.armorIdx++;logMsg('Chest: '+ARMORS[P.armorIdx].name+'! Equipped.','#ffd24a');}else{P.gold+=70;logMsg('Chest: 70 gold!','#e8c24a');}}}
function usePotion(kind){var P=G.P;if(kind==='hp'){if(P.inv.hp<=0){sfx.deny();logMsg('No health potions.');return;}if(P.hp>=P.hpMax){logMsg('Already at full health.');return;}P.inv.hp--;P.hp=Math.min(P.hpMax,P.hp+Math.round(P.hpMax*0.45)+25);sfx.heal();logMsg('Drank a health potion.');}else{if(P.inv.mp<=0){sfx.deny();logMsg('No mana potions.');return;}if(P.mp>=P.mpMax){logMsg('Already at full mana.');return;}P.inv.mp--;P.mp=Math.min(P.mpMax,P.mp+Math.round(P.mpMax*0.5)+20);sfx.potion();logMsg('Drank a mana potion.');}updateHUD();}
function toggleView(){G._viewed=true;G.view=(G.view==='fp')?'aerial':'fp';logMsg('View: '+(G.view==='fp'?'first-person':'overhead'),'#56b85b');sfx.blip();}
function death(){G.mode='over';setMusic('off');var sc=scoreNow();saveBest(sc);showGameOver(sc);}  /* keep the save as a checkpoint */

/* ── Snake ── */
var Snake=(function(){
  var N=18,CELL=20,timer=null,cvs,x,snake,dir,ndir,food,score,dead,kh,scEl;
  function start(){
    G.mode='minigame';
    stop();
    cvs=h('canvas',{width:String(N*CELL),height:String(N*CELL),style:'width:min(82vw,360px);height:auto;background:#0b140b;border:2px solid #2c5a2c;border-radius:10px;display:block;margin:0 auto;image-rendering:pixelated;touch-action:none;'});
    scEl=h('div',{class:'arcade',style:'color:#7fe07f;margin:8px 0;'});
    function db(lbl,fn){var b=h('div',{class:'ab',style:'pointer-events:auto;width:48px;height:48px;'},lbl);b.addEventListener('pointerdown',function(e){e.preventDefault();fn();});return b;}
    var pad=h('div',{style:'display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin:6px auto;width:fit-content;'},[
      h('div'),db('▲',function(){setDir(0,-1);}),h('div'),db('◄',function(){setDir(-1,0);}),db('▼',function(){setDir(0,1);}),db('►',function(){setDir(1,0);})]);
    var box=h('div',{},[h('h2',{style:'color:#7fe07f;margin:0 0 6px;',text:'🐍 Snake'}),cvs,scEl,pad,btn('Exit',function(){exitMinigame();},'small')]);
    openOverlay(box,'minigame');
    x=cvs.getContext('2d');
    reset(); MG.active={stop:stop};
    kh=function(e){var k=e.key.toLowerCase();if(k==='arrowup'||k==='w')setDir(0,-1);else if(k==='arrowdown'||k==='s')setDir(0,1);else if(k==='arrowleft'||k==='a')setDir(-1,0);else if(k==='arrowright'||k==='d')setDir(1,0);else if(k==='escape')exitMinigame();if(/arrow| /.test(k))e.preventDefault();};
    window.addEventListener('keydown',kh);
    var sx,sy;cvs.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
    cvs.addEventListener('touchend',function(e){if(sx==null)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);sx=null;});
    timer=setInterval(tick,110);
  }
  function reset(){snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};ndir=dir;score=0;dead=false;placeFood();draw();upd();}
  function setDir(dx,dy){if(dead)return;if(dx===-dir.x&&dy===-dir.y)return;ndir={x:dx,y:dy};}
  function placeFood(){do{food={x:rndi(N),y:rndi(N)};}while(snake.some(function(s){return s.x===food.x&&s.y===food.y;}));}
  function upd(){if(scEl)scEl.textContent='SCORE '+score+'   BEST '+mgBest('snake');}
  function tick(){if(dead)return;dir=ndir;var h2={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h2.x<0||h2.y<0||h2.x>=N||h2.y>=N||snake.some(function(s){return s.x===h2.x&&s.y===h2.y;})){dead=true;sfx.deny();mgSaveBest('snake',score);over();return;}snake.unshift(h2);if(h2.x===food.x&&h2.y===food.y){score+=10;sfx.gold();placeFood();}else snake.pop();draw();upd();}
  function draw(){if(!x)return;x.fillStyle='#0b140b';x.fillRect(0,0,N*CELL,N*CELL);x.fillStyle='#1a2a1a';for(var i=0;i<N;i++)for(var j=0;j<N;j++)if((i+j)&1){x.fillRect(i*CELL,j*CELL,CELL,CELL);}x.fillStyle='#e85a5a';x.beginPath();x.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL*0.35,0,7);x.fill();for(var s=0;s<snake.length;s++){x.fillStyle=s===0?'#9af09a':'#5fc05f';x.fillRect(snake[s].x*CELL+1,snake[s].y*CELL+1,CELL-2,CELL-2);}}
  function over(){var box=h('div',{},[h('h2',{style:'color:#7fe07f;',text:'Game Over'}),h('div',{style:'color:#cfd6df;margin:8px 0;',text:'Score '+score+'  ·  Best '+mgBest('snake')}),h('div',{style:'display:flex;gap:8px;justify-content:center;'},[btn('Play Again',function(){openOverlayKeep();reset();},'primary'),btn('Exit',function(){exitMinigame();})])]);openOverlay(box,'minigame');}
  function openOverlayKeep(){start();}
  function stop(){if(timer){clearInterval(timer);timer=null;}if(kh)window.removeEventListener('keydown',kh);}
  return {start:start,stop:stop};
})();

var AppleCatch=(function(){
  var W=360,H=420,raf=null,cvs,x,bx,apples,score,lives,spawnT,spd,last,kh,scEl,left,right,dead;
  function start(){
    G.mode='minigame';
    stop();
    cvs=h('canvas',{width:String(W),height:String(H),style:'width:min(82vw,360px);height:auto;background:#bfe2f5;border:2px solid #caa54a;border-radius:10px;display:block;margin:0 auto;touch-action:none;'});
    scEl=h('div',{class:'arcade',style:'color:#caa54a;margin:8px 0;'});
    function hb(lbl,dn,up){var b=h('div',{class:'ab',style:'pointer-events:auto;width:64px;height:56px;'},lbl);b.addEventListener('pointerdown',function(e){e.preventDefault();dn();});b.addEventListener('pointerup',function(e){e.preventDefault();up();});b.addEventListener('pointercancel',up);return b;}
    var pad=h('div',{style:'display:flex;gap:14px;justify-content:center;margin:6px auto;'},[hb('◄',function(){left=true;},function(){left=false;}),hb('►',function(){right=true;},function(){right=false;})]);
    var box=h('div',{},[h('h2',{style:'color:#caa54a;margin:0 0 6px;',text:'🍎 Apple Catch'}),cvs,scEl,pad,btn('Exit',function(){exitMinigame();},'small')]);
    openOverlay(box,'minigame');
    x=cvs.getContext('2d');bx=W/2;apples=[];score=0;lives=3;spawnT=0;spd=120;last=0;left=right=dead=false;
    MG.active={stop:stop};
    kh=function(e){var k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')left=true;else if(k==='arrowright'||k==='d')right=true;else if(k==='escape')exitMinigame();};
    var ku=function(e){var k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')left=false;else if(k==='arrowright'||k==='d')right=false;};
    window.addEventListener('keydown',kh);window.addEventListener('keyup',ku);AppleCatch._ku=ku;
    cvs.addEventListener('pointermove',function(e){var r=cvs.getBoundingClientRect();bx=clamp((e.clientX-r.left)/r.width*W,26,W-26);});

  }
  function loop(t){raf=requestAnimationFrame(loop);var dt=last?Math.min(0.05,(t-last)/1000):0.016;last=t;if(dead)return;if(left)bx=clamp(bx-260*dt,26,W-26);if(right)bx=clamp(bx+260*dt,26,W-26);spawnT-=dt;if(spawnT<=0){spawnT=Math.max(0.4,1.1-score*0.01);apples.push({x:26+rnd(W-52),y:-20,v:spd+rnd(60)+score*1.5,bomb:chance(0.18)});}for(var i=0;i<apples.length;i++){var a=apples[i];a.y+=a.v*dt;if(a.y>H-40&&a.y<H-10&&Math.abs(a.x-bx)<34){a.dead=true;if(a.bomb){lives--;sfx.hurt();if(lives<=0){dead=true;mgSaveBest('catch',score);over();}}else{score++;sfx.gold();}}else if(a.y>H){a.dead=true;if(!a.bomb){lives--;sfx.deny();if(lives<=0){dead=true;mgSaveBest('catch',score);over();}}}}apples=apples.filter(function(a){return !a.dead;});draw();}

   BOOT + INPUT — controls (keyboard / mouse drag-look / touch), loop.

var keysDown={};
function down(k){return !!keysDown[k];}
function recalcMove(){G.mv.f=clamp((down('w')||down('arrowup')?1:0)-(down('s')||down('arrowdown')?1:0),-1,1);G.mv.s=clamp((down('d')||down('arrowright')?1:0)-(down('a')||down('arrowleft')||down('q')?1:0),-1,1);G.mv.turn=0;}
function worldActive(){return G.mode==='town'||G.mode==='dungeon';}

function onKeyDown(e){
  initAudio();var k=e.key.toLowerCase();
  if(G.mode==='minigame')return; // minigames handle their own input
  if(G.mode==='dialogue'&&(k===' '||k==='enter')){advanceDialogue();e.preventDefault();return;}
  if(k==='escape'){if(worldActive())showPause();else if(G.mode==='pause'||G.mode==='inv'||G.mode==='shop')resumeWorld();else if(G.mode==='dialogue')closeDialogue();e.preventDefault();return;}
  if(!worldActive())return;
  if(keysDown[k])return;keysDown[k]=true;recalcMove();
  if(k==='f'){pressAttack();e.preventDefault();}
  else if(k===' '){jump();e.preventDefault();}
  else if(k==='shift'){abilityDown();}
  else if(k==='e'){doInteract();}
  else if(k==='1'){usePotion('hp');}
  else if(k==='2'){usePotion('mp');}
  else if(k==='i'){openInventory();}
  else if(k==='m'){showMap();}
  else if(k==='v'){toggleView();}
  else if(k==='g'){callAirstrike();}
}
function onKeyUp(e){var k=e.key.toLowerCase();keysDown[k]=false;recalcMove();if(k==='f')releaseAttack();else if(k==='shift')abilityUp();}

function wireCanvas(){
  var drag={};
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('pointerlockchange',function(){var was=G.locked;G.locked=(document.pointerLockElement===cv);if(was&&!G.locked&&worldActive())showPause();});  // Esc out of lock → pause (one press)
  document.addEventListener('mousemove',function(e){if(G.locked&&worldActive())G.lookDX+=e.movementX;});  // free mouse-look (no button)
  cv.addEventListener('pointerdown',function(e){initAudio();if(!worldActive())return;
    if(e.pointerType==='mouse'){
      if(!G.locked){if(cv.requestPointerLock)cv.requestPointerLock();return;}              // first click captures the mouse
      if(e.button===2){abilityDown();drag[e.pointerId]={type:'mouse',btn:2};return;}
      pressAttack();drag[e.pointerId]={type:'mouse',btn:0};return;
    }
    drag[e.pointerId]={x:e.clientX,moved:0,type:'touch',btn:0};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',function(e){var d=drag[e.pointerId];if(!d||d.type!=='touch')return;var dx=e.clientX-d.x;d.x=e.clientX;d.moved+=Math.abs(dx);G.lookDX+=dx;});

  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function wireTouch(){
  var stick=$('stick'),nub=stick.querySelector('.nub'),sid=null,cx=0,cy=0,R=54;

  stick.addEventListener('pointerdown',function(e){initAudio();sid=e.pointerId;var r=stick.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;stick.setPointerCapture(e.pointerId);mv(e);e.preventDefault();});

  stick.addEventListener('pointermove',mv);

  stick.addEventListener('pointerup',rel);stick.addEventListener('pointercancel',rel);
  function ab(label,cls,onDown,onUp){var b=h('div',{class:'ab '+(cls||'')},label);b.addEventListener('pointerdown',function(e){initAudio();e.preventDefault();onDown&&onDown();});if(onUp){b.addEventListener('pointerup',function(e){e.preventDefault();onUp();});b.addEventListener('pointercancel',function(){onUp();});}return b;}
  var actb=$('actbtns');actb.innerHTML='';
  actb.appendChild(ab('✋','',function(){doInteract();}));
  actb.appendChild(ab('✷','abil cast',function(){abilityDown();},function(){abilityUp();}));
  actb.appendChild(ab('⤴','abil',function(){jump();}));
